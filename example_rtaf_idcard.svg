<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1222"/>
      <stop offset="100%" stop-color="#17233b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <!-- White A4 photocopy paper -->
  <rect x="70" y="22" width="500" height="316" rx="14" fill="#f8fafc" filter="url(#shadow)"/>
  <!-- ID Card outline -->
  <rect x="145" y="42" width="350" height="202" rx="12" fill="#eef4fb" stroke="#94a3b8" stroke-width="2"/>
  <!-- Top header bar of Thai ID card -->
  <rect x="145" y="42" width="350" height="34" rx="12" fill="#dbeafe"/>
  <rect x="145" y="64" width="350" height="12" fill="#dbeafe"/>
  <text x="200" y="64" font-family="Prompt, Tahoma, sans-serif" font-size="14" font-weight="700" fill="#1e3a8a">บัตรประจำตัวประชาชน (ตัวอย่าง)</text>
  <!-- Chip -->
  <rect x="168" y="102" width="38" height="30" rx="5" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- Placeholder info lines -->
  <text x="220" y="104" font-family="Prompt, Tahoma, sans-serif" font-size="13" font-weight="600" fill="#334155">เลขประจำตัว 1-xxxx-xxxxx-xx-x</text>
  <rect x="220" y="118" width="165" height="9" rx="4" fill="#cbd5e1"/>
  <rect x="220" y="136" width="140" height="9" rx="4" fill="#cbd5e1"/>
  <rect x="220" y="154" width="155" height="9" rx="4" fill="#e2e8f0"/>
  <rect x="168" y="182" width="200" height="8" rx="4" fill="#e2e8f0"/>
  <rect x="168" y="198" width="150" height="8" rx="4" fill="#e2e8f0"/>
  <!-- Photo silhouette -->
  <rect x="405" y="92" width="72" height="92" rx="6" fill="#cbd5e1"/>
  <circle cx="441" cy="124" r="16" fill="#94a3b8"/>
  <path d="M417 176 C417 154 465 154 465 176 Z" fill="#94a3b8"/>
  <!-- Two crisp blue diagonal cross-out lines -->
  <line x1="158" y1="228" x2="462" y2="56" stroke="#1d4ed8" stroke-width="3.2" stroke-linecap="round"/>
  <line x1="186" y1="242" x2="486" y2="72" stroke="#1d4ed8" stroke-width="3.2" stroke-linecap="round"/>
  <!-- Text along the diagonal cross-out -->
  <g transform="rotate(-29.5 320 148)">
    <rect x="148" y="132" width="344" height="26" rx="6" fill="#f8fafc" fill-opacity="0.92"/>
    <text x="320" y="150" text-anchor="middle" font-family="Prompt, Tahoma, sans-serif" font-size="13.5" font-weight="700" fill="#1d4ed8">ใช้สำหรับทำบัตรผ่านยานพาหนะเข้า-ออก ทอ. เท่านั้น</text>
  </g>
  <!-- Signature section below card -->
  <text x="395" y="274" text-anchor="middle" font-family="Prompt, Tahoma, sans-serif" font-size="15" font-weight="700" fill="#1d4ed8">สำเนาถูกต้อง</text>
  <path d="M350 296 Q372 276 388 294 T435 288" fill="none" stroke="#1d4ed8" stroke-width="2.5" stroke-linecap="round"/>
  <text x="395" y="316" text-anchor="middle" font-family="Prompt, Tahoma, sans-serif" font-size="12.5" fill="#1e40af">( ชื่อ-นามสกุล / วันที่ ../../.... )</text>
  <!-- Tip callout bottom left -->
  <rect x="92" y="266" width="210" height="52" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="106" y="288" font-family="Prompt, Tahoma, sans-serif" font-size="12.5" font-weight="700" fill="#1e40af">✓ ขีดคร่อม 2 เส้น + เซ็นรับรอง</text>
  <text x="106" y="307" font-family="Prompt, Tahoma, sans-serif" font-size="11.5" fill="#334155">วางบัตรบนกระดาษขาวแล้วถ่ายให้ชัด</text>
</svg>
