<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1222"/>
      <stop offset="100%" stop-color="#17233b"/>
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="640" height="360" fill="url(#bg2)"/>
  <!-- White A4 photocopy paper -->
  <rect x="70" y="22" width="500" height="316" rx="14" fill="#f8fafc" filter="url(#shadow2)"/>
  <!-- Driver License Card -->
  <rect x="145" y="42" width="350" height="202" rx="12" fill="#fdf2f8" stroke="#94a3b8" stroke-width="2"/>
  <rect x="145" y="42" width="350" height="36" rx="12" fill="#fbcfe8"/>
  <rect x="145" y="66" width="350" height="12" fill="#fbcfe8"/>
  <text x="168" y="65" font-family="Prompt, Tahoma, sans-serif" font-size="14" font-weight="700" fill="#831843">ใบอนุญาตขับรถยนต์ (ยังไม่หมดอายุ)</text>
  <!-- Photo left -->
  <rect x="166" y="94" width="74" height="94" rx="6" fill="#cbd5e1"/>
  <circle cx="203" cy="126" r="16" fill="#94a3b8"/>
  <path d="M179 178 C179 156 227 156 227 178 Z" fill="#94a3b8"/>
  <!-- Info right -->
  <rect x="256" y="98" width="180" height="10" rx="4" fill="#cbd5e1"/>
  <rect x="256" y="118" width="150" height="9" rx="4" fill="#cbd5e1"/>
  <rect x="256" y="136" width="130" height="9" rx="4" fill="#e2e8f0"/>
  <!-- Expiry highlight badge -->
  <rect x="256" y="188" width="218" height="34" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.8"/>
  <text x="365" y="210" text-anchor="middle" font-family="Prompt, Tahoma, sans-serif" font-size="13" font-weight="700" fill="#166534">✓ วันสิ้นอายุ: ยังไม่หมดอายุ</text>
  <!-- Two blue diagonal cross-out lines -->
  <line x1="158" y1="226" x2="462" y2="56" stroke="#1d4ed8" stroke-width="3.2" stroke-linecap="round"/>
  <line x1="186" y1="240" x2="486" y2="72" stroke="#1d4ed8" stroke-width="3.2" stroke-linecap="round"/>
  <g transform="rotate(-29.5 320 148)">
    <rect x="148" y="132" width="344" height="26" rx="6" fill="#f8fafc" fill-opacity="0.93"/>
    <text x="320" y="150" text-anchor="middle" font-family="Prompt, Tahoma, sans-serif" font-size="13.5" font-weight="700" fill="#1d4ed8">ใช้สำหรับทำบัตรผ่านยานพาหนะเข้า-ออก ทอ. เท่านั้น</text>
  </g>
  <!-- Signature below -->
  <text x="405" y="274" text-anchor="middle" font-family="Prompt, Tahoma, sans-serif" font-size="15" font-weight="700" fill="#1d4ed8">สำเนาถูกต้อง</text>
  <path d="M360 296 Q382 276 398 294 T445 288" fill="none" stroke="#1d4ed8" stroke-width="2.5" stroke-linecap="round"/>
  <text x="405" y="316" text-anchor="middle" font-family="Prompt, Tahoma, sans-serif" font-size="12.5" fill="#1e40af">( ชื่อ-นามสกุล / วันที่ ../../.... )</text>
  <!-- Tip callout -->
  <rect x="92" y="266" width="218" height="52" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="106" y="288" font-family="Prompt, Tahoma, sans-serif" font-size="12.5" font-weight="700" fill="#065f46">✓ เห็นวันหมดอายุชัดเจน</text>
  <text x="106" y="307" font-family="Prompt, Tahoma, sans-serif" font-size="11.5" fill="#334155">ขีดคร่อม 2 เส้น + เซ็นรับรองสำเนา</text>
</svg>
